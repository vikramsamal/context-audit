[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-audit"
version = "0.1.0"
description = "Audit your codebase for AI coding context — local, read-only, and model-agnostic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Vikram Samal" },
]
keywords = [
    "ai",
    "llm",
    "coding-agent",
    "developer-tools",
    "ollama",
    "cursor",
    "copilot",
    "context",
    "token",
    "cli",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
context-audit = "context_audit.cli:main"

[project.urls]
Homepage = "https://github.com/vikramsamal/context-audit"
Repository = "https://github.com/vikramsamal/context-audit.git"
Issues = "https://github.com/vikramsamal/context-audit/issues"
Changelog = "https://github.com/vikramsamal/context-audit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/context_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []
